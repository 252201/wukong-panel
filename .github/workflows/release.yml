name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.7.5)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Release workflow must run from main, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          git fetch origin --tags
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$GITHUB_SHA" != "$remote_main" ]]; then
            echo "Workflow commit $GITHUB_SHA is not current main $remote_main" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi
          plain_version="${RELEASE_VERSION#v}"
          make_version="$(awk '$1 == "VERSION" && $2 == "?=" {print $3}' Makefile)"
          package_version="$(node -p "require('./web/package.json').version")"
          lock_version="$(node -p "require('./web/package-lock.json').version")"
          if [[ "$make_version" != "$plain_version" || "$package_version" != "$plain_version" || "$lock_version" != "$plain_version" ]]; then
            echo "Version mismatch: requested=$plain_version make=$make_version package=$package_version lock=$lock_version" >&2
            exit 1
          fi
          grep -Fq "version-v${plain_version}-" README.md
          grep -Fq -- "--version v${plain_version}" README.md

      - name: Test backend
        run: |
          go test ./...
          go vet ./...

      - name: Build web application
        run: npm ci && npm run build
        working-directory: web

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          plain_version="${RELEASE_VERSION#v}"
          ./scripts/build-release.sh "$plain_version"
          (
            cd release
            sha256sum -c SHA256SUMS
          )
          file release/wukong-panel-linux-amd64 | grep -Eq 'x86-64|x86_64'
          file release/wukong-panel-linux-arm64 | grep -Eq 'ARM aarch64|aarch64'
          for binary in release/wukong-panel-linux-amd64 release/wukong-panel-linux-arm64
          do
            strings "$binary" | grep -Fx "$plain_version" >/dev/null
            go version -m "$binary" | grep -F "vcs.revision=$GITHUB_SHA" >/dev/null
            go version -m "$binary" | grep -F "vcs.modified=false" >/dev/null
          done

      - name: Create annotated tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "252201"
          git config user.email "114610855+252201@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Wukong Panel $RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            --generate-notes \
            release/wukong-panel-linux-amd64 \
            release/wukong-panel-linux-arm64 \
            release/SHA256SUMS \
            release/install.sh \
            release/uninstall.sh

      - name: Verify published release assets
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          gh release download "$RELEASE_VERSION" --dir "$download_dir"
          (
            cd "$download_dir"
            sha256sum -c SHA256SUMS
          )
          for asset in \
            wukong-panel-linux-amd64 \
            wukong-panel-linux-arm64 \
            SHA256SUMS \
            install.sh \
            uninstall.sh
          do
            cmp "release/$asset" "$download_dir/$asset"
          done
          test "$(gh release view "$RELEASE_VERSION" --json tagName --jq .tagName)" = "$RELEASE_VERSION"
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$RELEASE_VERSION" --json isPrerelease --jq .isPrerelease)" = "false"
