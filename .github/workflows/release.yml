name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.8.1)
        required: true
        type: string
      release_notes:
        description: User-facing Markdown summary (what changed, who should upgrade, and important compatibility notes; do not paste raw commit lists)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Release workflow must run from main, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
            echo "release_notes input must not be empty" >&2
            exit 1
          fi
          git fetch origin --tags
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$GITHUB_SHA" != "$remote_main" ]]; then
            echo "Workflow commit $GITHUB_SHA is not current main $remote_main" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi
          plain_version="${RELEASE_VERSION#v}"
          make_version="$(awk '$1 == "VERSION" && $2 == "?=" {print $3}' Makefile)"
          package_version="$(node -p "require('./web/package.json').version")"
          lock_version="$(node -p "require('./web/package-lock.json').version")"
          if [[ "$make_version" != "$plain_version" || "$package_version" != "$plain_version" || "$lock_version" != "$plain_version" ]]; then
            echo "Version mismatch: requested=$plain_version make=$make_version package=$package_version lock=$lock_version" >&2
            exit 1
          fi
          grep -Fq "version-v${plain_version}-" README.md
          grep -Fq -- "--version v${plain_version}" README.md

      - name: Test backend
        run: |
          go test ./...
          go vet ./...

      - name: Build web application
        run: npm ci && npm run build
        working-directory: web

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          plain_version="${RELEASE_VERSION#v}"
          ./scripts/build-release.sh "$plain_version"
          (
            cd release
            sha256sum -c SHA256SUMS
          )
          file release/wukong-panel-linux-amd64 | grep -Eq 'x86-64|x86_64'
          file release/wukong-panel-linux-arm64 | grep -Eq 'ARM aarch64|aarch64'
          for binary in release/wukong-panel-linux-amd64 release/wukong-panel-linux-arm64
          do
            strings "$binary" | grep -Fx "$plain_version" >/dev/null
            go version -m "$binary" | grep -F "vcs.revision=$GITHUB_SHA" >/dev/null
            go version -m "$binary" | grep -F "vcs.modified=false" >/dev/null
          done

      - name: Prepare user-facing release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' '## 更新摘要'
            printf '%s\n\n' "$RELEASE_NOTES"
            printf '%s\n\n' '## 发布信息'
            printf '%s\n' "- 版本：$RELEASE_VERSION"
            printf '%s\n' "- 构建来源：main / $GITHUB_SHA"
            printf '%s\n' '- 正式资产已由 GitHub Actions 构建并完成校验。'
          } > release/RELEASE_NOTES.md
          test -s release/RELEASE_NOTES.md

      - name: Create annotated tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "252201"
          git config user.email "114610855+252201@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Wukong Panel $RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            --notes-file release/RELEASE_NOTES.md \
            release/wukong-panel-linux-amd64 \
            release/wukong-panel-linux-arm64 \
            release/SHA256SUMS \
            release/install.sh \
            release/uninstall.sh \
            release/bootstrap.sh

      - name: Verify published release assets
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          downloaded=false
          for attempt in 1 2 3 4 5
          do
            if gh release download "$RELEASE_VERSION" --dir "$download_dir" --clobber; then
              downloaded=true
              break
            fi
            echo "Release assets are not visible yet; retrying in 3 seconds (attempt $attempt/5)"
            sleep 3
          done
          if [[ "$downloaded" != true ]]; then
            echo "Unable to download published release assets after 5 attempts" >&2
            exit 1
          fi
          (
            cd "$download_dir"
            sha256sum -c SHA256SUMS
          )
          for asset in \
            wukong-panel-linux-amd64 \
            wukong-panel-linux-arm64 \
            SHA256SUMS \
            install.sh \
            uninstall.sh \
            bootstrap.sh
          do
            cmp "release/$asset" "$download_dir/$asset"
          done
          test "$(gh release view "$RELEASE_VERSION" --json tagName --jq .tagName)" = "$RELEASE_VERSION"
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$RELEASE_VERSION" --json isPrerelease --jq .isPrerelease)" = "false"
